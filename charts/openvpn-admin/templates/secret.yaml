{{- include "openvpn-admin.validateBasicAuth" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth
type: Opaque
data:
  username: {{ .Values.ingress.basicAuth.user | toString | b64enc | quote }}
  password: {{ .Values.ingress.basicAuth.password | toString | b64enc | quote }}
  auth: {{ print .Values.ingress.basicAuth.user ":{PLAIN}" .Values.ingress.basicAuth.password | b64enc | quote }}
