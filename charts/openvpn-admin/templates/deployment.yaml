{{- $inlet := .Values.openvpn.inlet | default "" }}
{{- $externalHosts := list }}
{{- if eq $inlet "ExternalIP" }}
{{- $externalHosts = include "openvpn-admin.externalIPs" . | fromJsonArray }}
{{- end }}
{{- with .Values.openvpn.externalHost }}
{{- $externalHosts = list (toString .) }}
{{- end }}
{{- $externalPort := include "openvpn-admin.externalPort" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openvpn
spec:
  selector:
    matchLabels:
      app: openvpn
  template:
    metadata:
      labels:
        app: openvpn
    spec:
      {{- if .Values.nodeSelector }}
      nodeSelector:
      {{- .Values.nodeSelector | toYaml | indent 8 | printf "\n%s" }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
      {{- .Values.tolerations | toYaml | indent 8 | printf "\n%s" }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 0
      serviceAccountName: openvpn
      containers:
      - name: ovpn-admin
        image: {{ .Values.ovpnAdmin.repo }}:{{ include "openvpn-admin.imageTag" (dict "tag" .Values.ovpnAdmin.tag "appVersion" .Chart.AppVersion) }}
        command:
        - /bin/sh
        - -c
        - /app/ovpn-admin
            --storage.backend="kubernetes.secrets"
            --listen.port="8000"
            --role="master"
            --ovpn.network="{{ .Values.openvpn.subnet }}"
            {{- with .Values.openvpn.subnetIPv6 }}
            --ovpn.network.ipv6="{{ . }}"
            {{- end }}
            {{- if eq $inlet "LoadBalancer" }}
            --ovpn.server.behindLB
            --ovpn.service="openvpn-external"
            {{- end }}
            --mgmt=main="127.0.0.1:8989"
            --ccd --ccd.path="/mnt/ccd"
            --easyrsa.path="/mnt/certs"
            {{- range $externalHosts }}
            {{- $host := trimPrefix "[" . | trimSuffix "]" }}
            --ovpn.server="{{ if contains ":" $host }}[{{ $host }}]{{ else }}{{ $host }}{{ end }}:{{ $externalPort }}:tcp"
            {{- end }}
        env:
        - name: BASIC_USERNAME
          valueFrom:
            secretKeyRef:
              name: basic-auth
              key: username
        - name: BASIC_PASSWORD
          valueFrom:
            secretKeyRef:
              name: basic-auth
              key: password
        # connection audit log written by the OpenVPN hooks, shared through the "audit" volume
        - name: OVPN_AUDIT_PATH
          value: /mnt/audit/audit.tsv
        ports:
        - name: ovpn-admin
          protocol: TCP
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /ping
            port: ovpn-admin
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /ping
            port: ovpn-admin
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 6
        volumeMounts:
          - name: certs
            mountPath: /mnt/certs
          - name: ccd
            mountPath: /mnt/ccd
          - name: audit
            mountPath: /mnt/audit
      - name: openvpn
        image: {{ .Values.openvpn.repo }}:{{ include "openvpn-admin.imageTag" (dict "tag" .Values.openvpn.tag "appVersion" .Chart.AppVersion) }}
        command: [ '/entrypoint.sh' ]
        env:
        # connection audit log written by the OpenVPN hooks (client-connect, client-disconnect), read by ovpn-admin
        - name: OVPN_AUDIT_LOG
          value: /etc/openvpn/audit/audit.tsv
        # imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            - MKNOD
            - SETGID
            - SETUID
            drop:
            - ALL
        ports:
        - name: openvpn-tcp
          protocol: TCP
          containerPort: 1194
          {{- if eq $inlet "HostPort" }}
          hostPort: {{ .Values.openvpn.hostPort }}
          {{- end }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: dev-net
          mountPath: /dev/net
        - name: certs
          mountPath: /etc/openvpn/certs
        - name: ccd
          mountPath: /etc/openvpn/ccd
        - name: audit
          mountPath: /etc/openvpn/audit
        - name: config
          mountPath: /etc/openvpn/openvpn.conf
          subPath: openvpn.conf
          readOnly: true
        - name: entrypoint
          mountPath: /entrypoint.sh
          subPath: entrypoint.sh
          readOnly: true
      volumes:
      - name: tmp
        emptyDir: {}
      - name: dev-net
        emptyDir: {}
      - name: certs
        emptyDir: {}
      - name: ccd
        emptyDir: {}
      - name: audit
        emptyDir: {}
      - name: config
        configMap:
          name: openvpn
          defaultMode: 0644
      - name: entrypoint
        configMap:
          name: openvpn
          defaultMode: 0755
