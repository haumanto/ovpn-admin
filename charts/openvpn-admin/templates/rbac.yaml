---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openvpn
---
# Namespaced Role, only what ovpn-admin uses (storage.backend=kubernetes.secrets and the LoadBalancer service lookup)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openvpn
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - create
  - update
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openvpn
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openvpn
subjects:
- kind: ServiceAccount
  name: openvpn
