# server 172.16.100.0 255.255.255.0
# server-ipv6 fd00:16:100::/64 (set OVPN_SERVER_NET6 to enable IPv6)
verb 3
tls-server
ca /etc/openvpn/easyrsa/pki/ca.crt
key /etc/openvpn/easyrsa/pki/private/server.key
cert /etc/openvpn/easyrsa/pki/issued/server.crt
dh /etc/openvpn/easyrsa/pki/dh.pem
crl-verify /etc/openvpn/easyrsa/pki/crl.pem
tls-auth /etc/openvpn/easyrsa/pki/ta.key
key-direction 0
# --- TLS and data channel policy (explicit, not left to the image defaults) ---
# TLS 1.2 is the floor: a client that offers only TLS 1.0 or 1.1 is refused.
tls-version-min 1.2
# TLS 1.2 control channel suites (TLS 1.3 suites are not affected by tls-cipher).
tls-cipher TLS-ECDHE-RSA-WITH-AES-256-GCM-SHA384:TLS-ECDHE-ECDSA-WITH-AES-256-GCM-SHA384
# Data channel: AEAD only. The server picks the first cipher in this list that the client also offers.
# There is no "cipher" and no "data-ciphers-fallback" line on purpose: the CBC ciphers and every other non-AEAD cipher
# are refused, and so is a client too old to negotiate a cipher. Such clients need a re-issued config (see UPGRADING.md).
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305
allow-compression no
# only certificates issued for client use are accepted (easy-rsa "client" certificates)
remote-cert-tls client
# Resource caps so one client cannot exhaust the server.
# max-clients: simultaneous clients. The default 200 is the literal below. OVPN_MAX_CLIENTS names the intended
# operator override, but OpenVPN does not substitute variables inside a config file: to change the cap, edit the
# number on the max-clients line (or mount your own openvpn.conf).
# max-routes-per-client: routes one client may announce via iroute / pushed routes, default 256.
max-clients 200
max-routes-per-client 256
#management 127.0.0.1 8989
keepalive 10 60
persist-key
persist-tun
topology subnet
#duplicate-cn
#proto tcp
#port 1194
#dev tun0
status /tmp/openvpn-status.log
user nobody
group nogroup
push "topology subnet"
push "route-metric 9999"
push "dhcp-option DNS 1.1.1.1"
# IPv6 DNS server for clients (OpenVPN 2.5+), e.g. when OVPN_SERVER_NET6 is set
#push "dhcp-option DNS6 2606:4700:4700::1111"
