# fail2ban filter for the ovpn-admin audit log (audit_master/audit.tsv), written by the OpenVPN hooks.
#
# Line format, tab separated (setup/audit.sh):
#   event <TAB> time_unix <TAB> username <TAB> real_ip <TAB> real_port <TAB> virtual_ip4 <TAB> virtual_ip6 <TAB> bytes_received <TAB> bytes_sent
#
# Only "auth_fail" (wrong password for a client that has a valid certificate) counts. auth_ok,
# connect and disconnect lines never match. The address is the 4th field, anchored by the
# preceding tab-separated fields: the hooks replace tabs inside the user name with a space, so a
# client cannot smuggle a fake address into the line by choosing its user name. A "-" (address
# unknown) does not match and is never banned.
#
# fail2ban reads the event time from the 2nd field (Unix seconds), not from a date at line start.

[INCLUDES]
before = common.conf

[Definition]
failregex = ^(?:auth_fail\t\d+)?\t[^\t]*\t<ADDR>\t[^\t]*(?:\t[^\t]*)*$

ignoreregex =

# The date pattern only matches auth_fail lines, so no other event ever gets a time stamp or a
# match. fail2ban cuts the matched date text ("auth_fail<TAB>time_unix") out of the line before it
# applies failregex, which is why the optional group in failregex is empty in practice. It is kept
# so the regex also holds if a fail2ban version leaves the text in place; either way a line that
# does not start with auth_fail (or, once cut, with a tab) cannot match.
datepattern = ^auth_fail\t{EPOCH}
