# fail2ban filter for the nginx access log of the ovpn-admin reverse proxy.
# Needs the log format "ovpn_admin" of docs/hardening/nginx-ovpn-admin.conf.example:
#   $remote_addr - - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" auth=$ovpn_admin_auth_sent
#
# Counts 401 answers to requests that carried an Authorization header (auth=1): wrong Basic Auth
# credentials. A 401 with auth=0 is the normal browser challenge before the login prompt and is
# ignored, as are 200, 429 and every other status. The address is the first field of the line and
# is set by nginx; nothing a client sends can reach it.

[INCLUDES]
before = common.conf

[Definition]
failregex = ^<ADDR> - - (?:\[[^\]]+\])?\s*"[^"]*" 401 \d+ "[^"]*" "[^"]*" auth=1$

ignoreregex =

# nginx $time_local, e.g. [17/Nov/2026:09:19:06 +0000]. fail2ban cuts the matched date text out of
# the line before it applies failregex, hence the optional bracket group in failregex (it holds
# the date only if a fail2ban version leaves it in place). The first match in the line is the one
# nginx wrote, so text a client puts later in the request or User-Agent cannot change the time.
datepattern = \[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]
